# No Plot Armor — kid collision fix (TweakXL, same technique as Beatable Brats).
# Bullets ghost through kids because of a pre-pipeline filter. Every known kid
# record gets isChild=false; records whose reaction preset is the Child type
# (the engine IsCharacterChildren check reads the preset type, not isChild)
# get ReactionPresets.Civilian_Passive instead, so they read as civilians.
# Requires TweakXL; without it this file is ignored. Reverts cleanly on uninstall.
Character.ChildAverage:
  isChild: false
  disableDefeatedState: true
  reactionPreset: ReactionPresets.Civilian_Passive
Character.ChildPoor:
  isChild: false
  disableDefeatedState: true
  reactionPreset: ReactionPresets.Civilian_Passive
